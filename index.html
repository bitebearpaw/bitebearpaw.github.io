<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熊熊學資訊</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐻</text></svg>">
<meta name="description" content="國中資訊科技互動教學小工具：遞迴、數位化、電腦組成等單元的互動網頁與投影片。">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--ink2:#5b6370;--line:#e0dbd1;--accent:#2563eb;--soft:#e8effd}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--card:#20232a;--ink:#e8e6e1;--ink2:#a3a7ae;--line:#353a44;--accent:#7aa2ff;--soft:#25335a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:40px 16px 60px}
header h1{margin:0;font-size:clamp(28px,5vw,40px)}
header p{margin:6px 0 0;color:var(--ink2);font-size:17px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:28px 0 8px}
.tools input{flex:1;min-width:200px;font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips button{font:inherit;font-size:15px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin:0 4px 4px 0}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:20px;margin:32px 0 12px;color:var(--ink2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card .icon{font-size:30px;line-height:1}
.card h3{margin:4px 0 0;font-size:20px}
.card p{margin:0;color:var(--ink2);font-size:15px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.meta span{font-size:13px;background:var(--soft);color:var(--ink);padding:2px 10px;border-radius:999px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a{font-size:15px;text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid var(--line);color:var(--ink)}
.links a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.links a:hover{border-color:var(--accent)}
.empty{color:var(--ink2);margin-top:30px}
footer{margin-top:50px;color:var(--ink2);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐻 熊熊學資訊</h1>
    <p>動手玩，才會懂 — 國中資訊科技互動教材。每個工具都可以下載後離線使用。</p>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="搜尋工具，例如：遞迴、聲音、影像…">
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <footer>新增工具：把資料夾放進這個 repo，並在 index.html 的 TOOLS 清單加一筆即可。</footer>
</div>

<script>
/* ================================================================
   工具清單：新增工具時，在這裡加一筆（順序 = 顯示順序）
   - url：站內工具用相對路徑（如 "hanoi/"），其他 repo 用完整網址
   - links：額外按鈕，例如投影片；download: true 會變成下載按鈕
   ================================================================ */
const TOOLS = [
  {
    title: "河內塔 Tower of Hanoi",
    icon: "🔁",
    unit: "程式設計",
    grade: "九年級",
    desc: "動手玩河內塔、看遞迴動畫與呼叫堆疊（C++），體會 2ⁿ−1 的指數成長。",
    url: "hanoi/",
    links: [
      { label: "教學投影片", href: "hanoi/slides.html" },
      { label: "下載網頁", href: "hanoi/index.html", download: "河內塔互動網頁.html" },
      { label: "下載投影片", href: "hanoi/slides.html", download: "河內塔教學投影片.html" },
    ],
    tags: ["遞迴", "演算法", "C++"],
  },
  {
    title: "電腦五大單元",
    icon: "🖥️",
    unit: "電腦組成",
    grade: "九年級",
    desc: "互動動畫認識電腦的五大單元：輸入、輸出、記憶、算術邏輯、控制。",
    url: "https://bitebearpaw.github.io/cs/",
    tags: ["硬體", "計算機組織"],
  },
  {
    title: "影像數位化體驗實驗室",
    icon: "🖼️",
    unit: "數位化",
    grade: "九年級",
    desc: "解析度、色彩深度與檔案大小的關係，動手體驗影像如何變成數字。",
    url: "https://bitebearpaw.github.io/image-widget/",
    tags: ["影像", "像素", "數位化"],
  },
  {
    title: "聲音數位化實驗室",
    icon: "🔊",
    unit: "數位化",
    desc: "取樣頻率與取樣位元數如何影響音質與檔案大小。",
    url: "https://bitebearpaw.github.io/sound-widget/",
    tags: ["聲音", "取樣", "數位化"],
  },
];

const units = ["全部", ...new Set(TOOLS.map(t => t.unit))];
let unit = "全部";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const hits = TOOLS.filter(t => (unit === "全部" || t.unit === unit) &&
    (!q || [t.title, t.desc, t.unit, ...(t.tags || [])].join(" ").toLowerCase().includes(q)));
  const groups = {};
  hits.forEach(t => (groups[t.unit] ||= []).push(t));
  document.getElementById("list").innerHTML = hits.length ? Object.entries(groups).map(([u, ts]) => `
    <h2>${esc(u)}</h2>
    <div class="grid">${ts.map(t => `
      <div class="card">
        <div class="icon">${t.icon || "🧩"}</div>
        <h3>${esc(t.title)}</h3>
        <p>${esc(t.desc)}</p>
        <div class="meta">${t.grade ? `<span>${esc(t.grade)}</span>` : ""}${(t.tags || []).map(g => `<span>${esc(g)}</span>`).join("")}</div>
        <div class="links">
          <a class="primary" href="${esc(t.url)}">開啟 →</a>
          ${(t.links || []).map(l => `<a href="${esc(l.href)}"${l.download ? ` download="${esc(l.download)}"` : ""}>${l.download ? "⬇ " : ""}${esc(l.label)}</a>`).join("")}
        </div>
      </div>`).join("")}
    </div>`).join("") : '<p class="empty">找不到符合的工具。</p>';
  document.getElementById("chips").innerHTML = units.map(u =>
    `<button class="${u === unit ? "on" : ""}" data-u="${esc(u)}">${esc(u)}</button>`).join("");
}
document.getElementById("chips").addEventListener("click", e => { if (e.target.dataset.u) { unit = e.target.dataset.u; render(); } });
document.getElementById("q").addEventListener("input", render);
render();
</script>
</body>
</html>
